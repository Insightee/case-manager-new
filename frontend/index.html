<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Case-centric care management for therapists, families, HR, and operations — session logs, reports, billing, and IEP in one platform."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="InsighteCase" />
    <meta
      property="og:description"
      content="Case-centric care management for therapists, families, HR, and operations."
    />
    <meta property="og:locale" content="en_IN" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <title>InsighteCase</title>
    <style>
      body {
        margin: 0;
        background: #f1f5f9;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      .route-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 100dvh;
        padding: 2rem 1.25rem;
        color: #64748b;
        font-size: 0.9375rem;
      }

      .route-loading__spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: route-loading-spin 0.7s linear infinite;
        flex-shrink: 0;
      }

      @keyframes route-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="route-loading" role="status" aria-live="polite">
        <span class="route-loading__spinner" aria-hidden="true"></span>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
